name: E2E: build validator & validate

on:
  push:
    branches:
      - feature/add-e2e-and-docs
  pull_request:
    branches:
      - feature/add-e2e-and-docs

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run end-to-end PowerShell script
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/run-e2e.ps1
