<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SwiftConvertor — Login</title>
  <style>
    body{font-family:Segoe UI,Arial,Helvetica,sans-serif;background:#f5f7fb;color:#222;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:white;padding:24px;border-radius:8px;box-shadow:0 6px 20px rgba(20,30,50,0.08);width:320px}
    h1{font-size:18px;margin:0 0 12px}
    label{display:block;font-size:12px;margin-top:8px}
    input{width:100%;padding:8px;margin-top:6px;border:1px solid #d6dbe6;border-radius:4px}
    .btn{margin-top:14px;width:100%;padding:10px;background:#0b63d6;color:#fff;border:none;border-radius:6px;cursor:pointer}
    .error{color:#b00020;margin-top:8px;font-size:13px}
    .small{font-size:12px;color:#666;margin-top:8px;text-align:center}
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in to SwiftConvertor</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button class="btn" type="submit">Sign in</button>
      <div id="error" class="error" role="alert" aria-live="polite" style="display:none"></div>
      <div class="small">Use <strong>admin</strong> / <strong>password123</strong></div>
    </form>
  </div>

  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const error = document.getElementById('error');
      const USER = 'admin';
      const PASS = 'password123';

      function showError(msg){ error.textContent = msg; error.style.display = 'block'; }
      function clearError(){ error.textContent = ''; error.style.display = 'none'; }

      form.addEventListener('submit', function(e){
        e.preventDefault();
        clearError();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        if(u === USER && p === PASS){
          // mark session and forward to dashboard
          try { sessionStorage.setItem('swift.loggedIn', '1'); } catch(e){}
          window.location.href = 'dashboard.html';
          return;
        }
        showError('Invalid username or password');
      });
    })();
  </script>
</body>
</html>
